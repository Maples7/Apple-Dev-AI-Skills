# Copy this file into a consuming project as one of:
# - xcstrings-project-profile.yaml
# - .ai/xcstrings-project-profile.yaml
# - .github/xcstrings-project-profile.yaml

catalogs:
  explicit_paths: []
  include_names:
    - Localizable.xcstrings
    - InfoPlist.xcstrings
    - AppShortcuts.xcstrings

default_target_locales: []

# Apple platforms this app ships on, used when deciding whether interaction
# wording may need device variations instead of one shared string.
# Example: [iOS, iPadOS, macOS, watchOS, visionOS]
supported_platforms: []

# Ask before changing a plain stringUnit into plural or device variations.
variation_policy:
  ask_before_adding_plural_variations: true
  ask_before_adding_device_variations: true
  platform_action_terms:
    macOS:
      primary_pointer_action: click
    iOS:
      primary_touch_action: tap
    iPadOS:
      primary_touch_action: tap
    watchOS:
      primary_touch_action: tap
    visionOS:
      primary_direct_action: tap

brand_tokens:
  preserve_verbatim: []
  cjk_spacing_tokens: []

english_only_keys: []

glossary: {}

locale_rules:
  zh-Hans:
    punctuation: full-width-near-cjk
  zh-Hant:
    punctuation: full-width-near-cjk

# Example shape for glossary:
# glossary:
#   Transaction:
#     ja: 取引
#     zh-Hans: 交易
#     zh-Hant: 交易
#   Account:
#     ja: 口座
