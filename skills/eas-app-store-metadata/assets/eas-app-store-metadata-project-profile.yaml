# Copy this file into your repository as eas-app-store-metadata-project-profile.yaml,
# .ai/eas-app-store-metadata-project-profile.yaml, or
# .github/eas-app-store-metadata-project-profile.yaml and customize it per project.

submit_profile: production
metadata_path: store.config.json

app_config_paths:
  - app.json
  - app.config.js
  - app.config.ts

eas_project:
  require_linkage: true
  project_id_hint_path: expo.extra.eas.projectId

native_version:
  source: xcode-marketing-version
  notes: >-
    Describe where the user-facing app version is sourced from, for example Xcode
    MARKETING_VERSION, Expo app config, or another release manifest.

shipped_locales:
  - en-US

metadata:
  protected_fields:
    - privacyPolicyUrl
    - supportUrl
  review_fields:
    - title
    - subtitle
    - keywords
    - promoText
    - releaseNotes
    - screenshots

screenshots:
  enabled: true
  roots:
    - store/apple/screenshot

release:
  require_new_asc_draft_before_push: true
  update_release_notes_for_all_locales: true
  attach_build_after_processing: true
  review_submission_owner: app-store-connect

credentials:
  # Never store the App Store Connect .p8 file under the repository tree.
  # Recommended best default on macOS: keep it in a user-private Application
  # Support directory outside the checkout, then reference it from untracked
  # local config or environment.
  # In tracked eas.json, prefer the supported EAS submit pattern:
  # "ascApiKeyPath": "$ASC_API_KEY_PATH"
  # Example local-only environment variable:
  # export ASC_API_KEY_PATH="$HOME/Library/Application Support/eas/credentials/<apple-team-id>/AuthKey_<key-id>.p8"
  eas_json_path: eas.json
  shared_eas_json_allowed: true
  local_config_gitignored: true
  api_key_storage_policy: outside-repo-only
  api_key_path_style: user-private-macos-application-support-directory
  local_env_var_name: ASC_API_KEY_PATH
  local_path_example: "$HOME/Library/Application Support/eas/credentials/<apple-team-id>/AuthKey_<key-id>.p8"
  tracked_eas_json_path_reference: "$ASC_API_KEY_PATH"

commands:
  pull: eas metadata:pull --profile production
  lint: eas metadata:lint --profile production
  push: eas metadata:push --profile production
