# Copy this file into your repository as commit-message-profile.yaml,
# .ai/commit-message-profile.yaml, or .github/commit-message-profile.yaml
# and customize the values to match your team's commit policy.

require_scope: true

allowed_types:
  - feat
  - fix
  - refactor
  - perf
  - docs
  - test
  - build
  - ci
  - chore

default_type: chore

# optional | required | monorepo-package | top-level-dir
scope_strategy: monorepo-package

# Map repository paths or package names to preferred commit scopes.
scope_aliases:
  apps/mobile: mobile
  apps/web: web
  packages/design-system: design-system
  packages/api: api

# Add these footers only when the evidence exists in branch names,
# conversation context, or explicit user input.
required_footers:
  - Refs

closing_footer_prefix: Closes
reference_footer_prefix: Refs

# auto | always | types:feat,fix,refactor
body_policy: types:feat,fix,refactor

# When the diff spans more than one major package or concern, suggest a split.
split_hint_threshold: multi-package
